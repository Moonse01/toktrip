spring.datasource.url=jdbc:h2:mem:toktrip;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

openai.api.key=test-openai-key
openai.model=gpt-4o-mini
openai.parser.model=gpt-4o-mini
openai.planner.model=gpt-4o-mini
openai.final-planner.model=gpt-4o-mini
kakao.rest.api.key=test-kakao-key
tmap.api.key=test-tmap-key
jwt.secret=test-jwt-secret-for-tests-only-at-least-32-bytes-long

spring.security.oauth2.client.registration.kakao.client-id=test-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-client-secret
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

app.frontend.url=http://localhost:5174
cors.allowed-origins=http://localhost:5174

