spring.application.name=toktrip
server.port=${SERVER_PORT:8080}

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5174}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toktrip?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:toktrip}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

jwt.secret=${JWT_SECRET}

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.parser.model=${OPENAI_PARSER_MODEL:gpt-4o-mini}
openai.planner.model=${OPENAI_PLANNER_MODEL:gpt-4o-mini}
openai.final-planner.model=${OPENAI_FINAL_PLANNER_MODEL:gpt-4o-mini}

kakao.rest.api.key=${KAKAO_REST_API_KEY:}
tmap.api.key=${TMAP_API_KEY:}
